<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGS Calendar - Responsive Layout Showcase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        saints: {
                            navy: '#0B1320',
                            surface: '#14213D',
                            card: '#1C2D4B',
                            red: '#C8102E',
                            redHover: '#A00C23',
                            gold: '#D4AF37',
                            white: '#EAEFF5',
                            muted: '#8B9BB4',
                            border: '#243552',
                            athletics: '#00A3E0',
                            boarding: '#00E676',
                            arts: '#D4AF37'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        * { touch-action: manipulation; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B1320; }
        ::-webkit-scrollbar-thumb { background: #243552; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        .theme-navy { --bg-main: #0B1320; --bg-surface: #14213D; --bg-card: #1C2D4B; }
        .theme-red { --bg-main: #1A0508; --bg-surface: #2E0B10; --bg-card: #42121A; }
        .theme-slate { --bg-main: #181A1B; --bg-surface: #222527; --bg-card: #2D3135; }
        .theme-emerald { --bg-main: #061810; --bg-surface: #0E2E20; --bg-card: #164230; }
        .theme-cyberpunk { --bg-main: #0D0221; --bg-surface: #190535; --bg-card: #2C0B54; }
        .theme-gold { --bg-main: #141006; --bg-surface: #241C0C; --bg-card: #382B14; }
        .theme-black { --bg-main: #000000; --bg-surface: #0B0B0B; --bg-card: #161616; }

        .app-bg-surface { background-color: var(--bg-surface, #14213D); }
        .app-bg-card { background-color: var(--bg-card, #1C2D4B); }
        .app-bg-main { background-color: var(--bg-main, #0B1320); }
    </style>
</head>
<body class="bg-saints-navy text-saints-white h-screen flex flex-col overflow-hidden theme-navy">

    <header class="h-16 bg-saints-surface border-b border-saints-border flex items-center justify-between px-3 md:px-6 flex-shrink-0 z-30 app-bg-surface">
        <div class="flex items-center gap-2 md:gap-4">
            <button id="sidebarToggleBtn" class="p-2 rounded-full hover:bg-saints-card text-saints-white md:hidden min-w-[44px] min-h-[44px] flex items-center justify-center">
                <span class="material-icons-outlined">menu</span>
            </button>
            <div class="flex items-center gap-2 font-bold text-base md:text-lg">
                <span class="material-icons-outlined text-saints-gold text-2xl">grid_view</span>
                <span class="hidden sm:inline tracking-wide">SGS <span class="text-saints-red">LAYOUTS</span></span>
            </div>
            
            <div id="viewportBadge" class="bg-saints-card text-saints-gold border border-saints-gold/30 text-[11px] font-mono px-2.5 py-1 rounded-full flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="breakpointText">Mobile (&lt;640px)</span>
            </div>
        </div>

        <!-- Global Search -->
        <div class="hidden sm:flex items-center bg-saints-card border border-saints-border rounded-full px-3 py-1.5 w-40 md:w-64 focus-within:w-72 transition-all">
            <span class="material-icons-outlined text-saints-muted text-sm mr-2">search</span>
            <input type="text" id="globalSearchInput" placeholder="Search events..." class="bg-transparent border-none text-xs md:text-sm text-saints-white focus:outline-none w-full">
        </div>

        <div class="flex items-center gap-2">
            <button id="tokenVaultBtn" class="flex items-center gap-1.5 bg-saints-card border border-saints-gold px-3 py-1.5 rounded-full text-xs md:text-sm font-semibold text-saints-gold hover:scale-105 transition-transform min-h-[44px]">
                <span class="material-icons-outlined text-base">stars</span>
                <span id="tokenBadgeCount">0 Tokens</span>
            </button>
        </div>
    </header>

    <section class="bg-saints-card border-b border-saints-border px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-20 text-xs md:text-sm app-bg-card">
        <div class="flex items-center gap-2 font-medium">
            <span class="text-saints-gold font-semibold uppercase text-[10px] tracking-wider bg-saints-navy px-2 py-0.5 rounded border border-saints-border">Layout Switcher</span>
            <span class="hidden md:inline text-saints-muted">Active Responsive Pattern:</span>
        </div>

        <div class="flex items-center gap-1 bg-saints-navy p-1 rounded-lg border border-saints-border overflow-x-auto max-w-full">
            <button class="layout-btn active px-3 py-1.5 rounded-md font-medium transition-all text-xs flex items-center gap-1 bg-saints-red text-white" data-layout="grid">
                <span class="material-icons-outlined text-sm">grid_on</span> Layout 1: Card Grid
            </button>
            <button class="layout-btn px-3 py-1.5 rounded-md font-medium transition-all text-xs flex items-center gap-1 text-saints-muted hover:text-white" data-layout="kanban">
                <span class="material-icons-outlined text-sm">view_column</span> Layout 2: Kanban Split
            </button>
            <button class="layout-btn px-3 py-1.5 rounded-md font-medium transition-all text-xs flex items-center gap-1 text-saints-muted hover:text-white" data-layout="dashboard">
                <span class="material-icons-outlined text-sm">dashboard</span> Layout 3: Master-Detail
            </button>
        </div>
    </section>

    <div class="flex flex-1 overflow-hidden relative">
        <div id="drawerBackdrop" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

        <aside id="appSidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-saints-surface border-r border-saints-border p-4 flex flex-col gap-5 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out app-bg-surface overflow-y-auto">
            <div class="flex items-center justify-between md:hidden pb-2 border-b border-saints-border">
                <span class="font-bold text-saints-gold text-sm">SGS Navigation</span>
                <button id="closeDrawerBtn" class="p-1 rounded-full text-saints-muted hover:text-white min-w-[44px] min-h-[44px] flex items-center justify-center">
                    <span class="material-icons-outlined">close</span>
                </button>
            </div>

            <button id="openCreateEventModalBtn" class="bg-saints-red hover:bg-saints-redHover text-white font-semibold py-3 px-5 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-transform active:scale-95 min-h-[44px]">
                <span class="material-icons-outlined">add_circle</span>
                <span>Create Event</span>
            </button>

            <!-- Category Filters -->
            <div class="flex flex-col gap-2.5">
                <span class="text-[11px] font-bold uppercase tracking-wider text-saints-muted">Saints Categories</span>
                
                <label class="flex items-center justify-between p-2 rounded-lg bg-saints-card/50 border border-saints-border cursor-pointer hover:bg-saints-card min-h-[44px]">
                    <span class="flex items-center gap-2 text-xs font-medium">
                        <span class="w-3 h-3 rounded-full bg-saints-red"></span> Academics
                    </span>
                    <input type="checkbox" class="cat-filter accent-saints-red w-4 h-4" data-cat="academics" checked>
                </label>

                <label class="flex items-center justify-between p-2 rounded-lg bg-saints-card/50 border border-saints-border cursor-pointer hover:bg-saints-card min-h-[44px]">
                    <span class="flex items-center gap-2 text-xs font-medium">
                        <span class="w-3 h-3 rounded-full bg-saints-athletics"></span> Athletics
                    </span>
                    <input type="checkbox" class="cat-filter accent-saints-athletics w-4 h-4" data-cat="athletics" checked>
                </label>

                <label class="flex items-center justify-between p-2 rounded-lg bg-saints-card/50 border border-saints-border cursor-pointer hover:bg-saints-card min-h-[44px]">
                    <span class="flex items-center gap-2 text-xs font-medium">
                        <span class="w-3 h-3 rounded-full bg-saints-arts"></span> Fine Arts
                    </span>
                    <input type="checkbox" class="cat-filter accent-saints-arts w-4 h-4" data-cat="arts" checked>
                </label>

                <label class="flex items-center justify-between p-2 rounded-lg bg-saints-card/50 border border-saints-border cursor-pointer hover:bg-saints-card min-h-[44px]">
                    <span class="flex items-center gap-2 text-xs font-medium">
                        <span class="w-3 h-3 rounded-full bg-saints-boarding"></span> Harker Boarding
                    </span>
                    <input type="checkbox" class="cat-filter accent-saints-boarding w-4 h-4" data-cat="boarding" checked>
                </label>
            </div>

            <!-- Current Layout Info Box -->
            <div class="mt-auto p-3 rounded-xl bg-saints-navy border border-saints-border text-xs flex flex-col gap-1">
                <span class="text-saints-gold font-semibold flex items-center gap-1">
                    <span class="material-icons-outlined text-sm">code</span> CSS Breakpoint Spec
                </span>
                <span id="layoutSpecText" class="text-saints-muted text-[11px] font-mono leading-relaxed">
                    grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4
                </span>
            </div>
        </aside>

        <!-- Main Viewport Container -->
        <main class="flex-1 flex flex-col overflow-y-auto p-4 md:p-6 bg-saints-navy app-bg-main" id="mainViewportContainer">
            <div id="layoutRenderNode" class="w-full h-full"></div>
        </main>
    </div>

    <nav class="md:hidden h-14 bg-saints-surface border-t border-saints-border flex items-center justify-around z-20 px-2 app-bg-surface">
        <button id="mobileNavAdd" class="flex flex-col items-center justify-center text-saints-red hover:scale-110 transition-transform min-w-[44px] min-h-[44px]">
            <span class="material-icons-outlined text-2xl">add_circle</span>
            <span class="text-[10px] font-bold">New</span>
        </button>
        <button id="mobileNavVault" class="flex flex-col items-center justify-center text-saints-gold min-w-[44px] min-h-[44px]">
            <span class="material-icons-outlined text-lg">stars</span>
            <span class="text-[10px]">Vault</span>
        </button>
    </nav>

    <div id="toastContainer" class="fixed bottom-16 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Event Modal -->
    <div id="eventModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-saints-surface border border-saints-border rounded-2xl w-full max-w-md p-5 shadow-2xl flex flex-col gap-4 app-bg-surface">
            <div class="flex items-center justify-between border-b border-saints-border pb-3">
                <h3 id="eventModalTitle" class="font-bold text-base text-saints-white">Create Saints Event</h3>
                <button class="closeModalBtn text-saints-muted hover:text-white p-1 min-w-[44px] min-h-[44px] flex items-center justify-center"><span class="material-icons-outlined">close</span></button>
            </div>

            <div class="flex flex-col gap-3">
                <div>
                    <label class="text-xs font-medium text-saints-muted mb-1 block">Event Title</label>
                    <input type="text" id="inputEventTitle" placeholder="e.g. AP Calculus Exam" class="w-full bg-saints-card border border-saints-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-saints-gold">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-saints-muted mb-1 block">Category</label>
                        <select id="inputEventCategory" class="w-full bg-saints-card border border-saints-border rounded-lg p-2.5 text-xs text-white focus:outline-none">
                            <option value="academics">Academics</option>
                            <option value="athletics">Athletics</option>
                            <option value="arts">Fine Arts</option>
                            <option value="boarding">Harker Boarding</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-medium text-saints-muted mb-1 block">Date</label>
                        <input type="date" id="inputEventDate" class="w-full bg-saints-card border border-saints-border rounded-lg p-2 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-medium text-saints-muted mb-1 block">Description</label>
                    <textarea id="inputEventDesc" rows="3" placeholder="Additional event details..." class="w-full bg-saints-card border border-saints-border rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-saints-gold resize-none"></textarea>
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t border-saints-border">
                <button id="deleteEventBtn" class="hidden bg-red-600/20 hover:bg-red-600/40 text-red-400 font-semibold text-xs px-4 py-2.5 rounded-lg border border-red-500/30 transition-colors mr-auto min-h-[44px]">Delete</button>
                <button class="closeModalBtn bg-saints-card hover:bg-saints-navy text-xs text-saints-white font-medium px-4 py-2.5 rounded-lg border border-saints-border min-h-[44px]">Cancel</button>
                <button id="saveEventSubmitBtn" class="bg-saints-red hover:bg-saints-redHover text-xs text-white font-semibold px-5 py-2.5 rounded-lg transition-colors min-h-[44px]">Save Event</button>
            </div>
        </div>
    </div>

    <!-- Theme Vault & Redeem Code Modal -->
    <div id="vaultModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-saints-surface border border-saints-border rounded-2xl w-full max-w-lg p-5 shadow-2xl flex flex-col gap-4 max-h-[90vh] overflow-hidden app-bg-surface">
            <div class="flex items-center justify-between border-b border-saints-border pb-3">
                <div class="flex items-center gap-2">
                    <span class="material-icons-outlined text-saints-gold">auto_awesome</span>
                    <h3 class="font-bold text-base text-saints-white">Theme Vault & Redeem</h3>
                </div>
                <button class="closeModalBtn text-saints-muted hover:text-white p-1 min-w-[44px] min-h-[44px] flex items-center justify-center"><span class="material-icons-outlined">close</span></button>
            </div>

            <!-- Developer Secret Redeem Code Input -->
            <div class="bg-saints-navy/90 border border-saints-gold/50 p-3 rounded-xl flex flex-col gap-2">
                <label class="text-[11px] font-bold text-saints-gold uppercase tracking-wider flex items-center gap-1">
                    <span class="material-icons-outlined text-xs">code</span> Secret Code Unlock
                </label>
                <div class="flex gap-2">
                    <input type="text" id="developerRedeemInput" placeholder="Enter code (happybirthdaydaniel)..." class="flex-1 bg-saints-card border border-saints-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-saints-gold">
                    <button id="redeemCodeBtn" class="bg-saints-gold hover:bg-yellow-500 text-black font-bold text-xs px-4 py-2 rounded-lg transition-colors min-h-[44px] flex items-center gap-1">
                        <span class="material-icons-outlined text-sm">key</span> Redeem
                    </button>
                </div>
            </div>

            <button id="gachaPullBtn" class="bg-gradient-to-r from-yellow-500 via-pink-600 to-purple-600 hover:opacity-95 text-white font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95 min-h-[44px]">
                <span class="material-icons-outlined">casino</span>
                <span>PULL THEME (1 TOKEN)</span>
            </button>

            <div id="vaultThemesList" class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1 max-h-[220px]"></div>

            <div class="flex justify-end pt-2 border-t border-saints-border">
                <button class="closeModalBtn bg-saints-card hover:bg-saints-navy text-xs text-saints-white font-semibold px-5 py-2.5 rounded-lg border border-saints-border min-h-[44px]">Close</button>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-saints-card';
            toast.className = `${bgClass} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl border border-white/20 flex items-center gap-2 pointer-events-auto transition-all transform translate-y-2 opacity-0`;
            toast.innerHTML = `<span class="material-icons-outlined text-sm">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info'}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const STORAGE_EVENTS_KEY = 'SGS_ARCH_EVENTS_V5';
        const STORAGE_TOKENS_KEY = 'SGS_ARCH_TOKENS_V5';
        const STORAGE_THEME_KEY = 'SGS_ARCH_THEME_V5';
        const STORAGE_UNLOCKED_KEY = 'SGS_ARCH_UNLOCKED_V5';

        const INITIAL_EVENTS = [
            { id: 101, title: 'AP Physics Midterm', cat: 'academics', date: '2026-09-15', desc: 'Room 302 - Scientific Calculator Required' },
            { id: 102, title: 'Saints Soccer Match', cat: 'athletics', date: '2026-09-18', desc: 'Chanticleer Field - Kickoff vs VC' },
            { id: 103, title: 'Senior Jazz Ensemble', cat: 'arts', date: '2026-09-22', desc: 'Main Auditorium - Formal Dress' },
            { id: 104, title: 'Harker Hall BBQ', cat: 'boarding', date: '2026-09-25', desc: 'Boarding Quadrangle - Evening Social' },
            { id: 105, title: 'Robotics Team Demo', cat: 'academics', date: '2026-09-28', desc: 'Innovation Lab - Autonomous Code Presentation' },
            { id: 106, title: 'Cross Country Meet', cat: 'athletics', date: '2026-10-02', desc: 'Spreckels Park - Regional Qualifier' }
        ];

        function getStoredEvents() {
            try {
                const data = localStorage.getItem(STORAGE_EVENTS_KEY);
                return data ? JSON.parse(data) : INITIAL_EVENTS;
            } catch (e) { return INITIAL_EVENTS; }
        }

        function saveStoredEvents(events) {
            try { localStorage.setItem(STORAGE_EVENTS_KEY, JSON.stringify(events)); } catch (e) {}
        }

        let currentActiveLayout = 'grid';
        let searchQuery = '';
        let activeCategories = new Set(['academics', 'athletics', 'arts', 'boarding']);

        function renderCurrentLayout() {
            const container = document.getElementById('layoutRenderNode');
            const layoutSpecText = document.getElementById('layoutSpecText');
            if (!container) return;

            const events = getStoredEvents().filter(e => {
                const matchesCat = activeCategories.has(e.cat);
                const matchesSearch = !searchQuery || e.title.toLowerCase().includes(searchQuery) || (e.desc && e.desc.toLowerCase().includes(searchQuery));
                return matchesCat && matchesSearch;
            });

            container.innerHTML = '';

            if (currentActiveLayout === 'grid') {
                // Layout 1: grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4
                layoutSpecText.innerText = "grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4";
                
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 w-full";
                
                events.forEach(evt => grid.appendChild(createEventCard(evt)));
                container.appendChild(grid);

            } else if (currentActiveLayout === 'kanban') {
                // Layout 2: grid-cols-1 md:grid-cols-2 lg:grid-cols-4
                layoutSpecText.innerText = "grid-cols-1 md:grid-cols-2 lg:grid-cols-4";

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full h-full";

                const categories = [
                    { id: 'academics', title: 'Academics', color: 'border-saints-red' },
                    { id: 'athletics', title: 'Athletics', color: 'border-saints-athletics' },
                    { id: 'arts', title: 'Fine Arts', color: 'border-saints-arts' },
                    { id: 'boarding', title: 'Harker Boarding', color: 'border-saints-boarding' }
                ];

                categories.forEach(cat => {
                    const col = document.createElement('div');
                    col.className = `bg-saints-surface/60 border-t-4 ${cat.color} border-saints-border border p-3 rounded-xl flex flex-col gap-3 min-h-[300px] app-bg-surface`;
                    
                    const catEvts = events.filter(e => e.cat === cat.id);
                    col.innerHTML = `<div class="flex items-center justify-between font-bold text-xs text-saints-gold pb-2 border-b border-saints-border"><span>${cat.title}</span><span class="bg-saints-navy px-2 py-0.5 rounded-full text-[10px] text-white">${catEvts.length}</span></div>`;
                    
                    const list = document.createElement('div');
                    list.className = "flex flex-col gap-2.5 flex-1 overflow-y-auto";
                    catEvts.forEach(evt => list.appendChild(createEventCard(evt)));
                    col.appendChild(list);
                    grid.appendChild(col);
                });

                container.appendChild(grid);

            } else if (currentActiveLayout === 'dashboard') {
                // Layout 3: grid-cols-1 lg:grid-cols-12
                layoutSpecText.innerText = "grid-cols-1 lg:grid-cols-12";

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 lg:grid-cols-12 gap-5 w-full h-full";

                // Sidebar/Summary Panel (4 cols on lg)
                const leftPanel = document.createElement('div');
                leftPanel.className = "lg:col-span-4 bg-saints-surface border border-saints-border p-4 rounded-2xl flex flex-col gap-4 app-bg-surface";
                leftPanel.innerHTML = `
                    <div class="flex items-center gap-2 text-saints-gold font-bold text-sm">
                        <span class="material-icons-outlined">analytics</span>
                        <span>Saints Event Metrics</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="bg-saints-card p-3 rounded-xl border border-saints-border"><span class="block text-xl font-bold text-white">${events.length}</span><span class="text-[10px] text-saints-muted uppercase">Total Events</span></div>
                        <div class="bg-saints-card p-3 rounded-xl border border-saints-border"><span class="block text-xl font-bold text-saints-gold">4</span><span class="text-[10px] text-saints-muted uppercase">Departments</span></div>
                    </div>
                `;

                // Main Event Timeline Feed (8 cols on lg)
                const rightPanel = document.createElement('div');
                rightPanel.className = "lg:col-span-8 flex flex-col gap-3";
                events.forEach(evt => rightPanel.appendChild(createEventCard(evt, true)));

                grid.appendChild(leftPanel);
                grid.appendChild(rightPanel);
                container.appendChild(grid);
            }
        }

        function createEventCard(evt, isLandscape = false) {
            const card = document.createElement('div');
            const catColors = {
                academics: 'border-l-saints-red',
                athletics: 'border-l-saints-athletics',
                arts: 'border-l-saints-arts',
                boarding: 'border-l-saints-boarding'
            };

            card.className = `bg-saints-card hover:border-saints-gold/60 border border-saints-border border-l-4 ${catColors[evt.cat] || 'border-l-saints-muted'} p-3.5 rounded-xl shadow-lg flex flex-col gap-2 cursor-pointer transition-all hover:scale-[1.01] active:scale-95 app-bg-card`;
            card.innerHTML = `
                <div class="flex items-start justify-between gap-2">
                    <span class="font-bold text-sm text-white">${evt.title}</span>
                    <span class="text-[10px] font-mono text-saints-gold bg-saints-navy px-2 py-0.5 rounded border border-saints-border">${evt.date}</span>
                </div>
                <p class="text-xs text-saints-muted line-clamp-2">${evt.desc || 'No description available.'}</p>
            `;

            card.addEventListener('click', () => openEventEditModal(evt));
            return card;
        }

        function updateViewportTelemetry() {
            const width = window.innerWidth;
            const badgeText = document.getElementById('breakpointText');
            if (!badgeText) return;

            if (width < 640) badgeText.innerText = "Mobile (<640px) [grid-cols-1]";
            else if (width < 768) badgeText.innerText = "SM (640-768px) [sm:grid-cols-2]";
            else if (width < 1024) badgeText.innerText = "MD (768-1024px) [md:grid-cols-2]";
            else if (width < 1280) badgeText.innerText = "LG (1024-1280px) [lg:grid-cols-3]";
            else badgeText.innerText = "XL (>1280px) [xl:grid-cols-4]";
        }

        window.addEventListener('resize', updateViewportTelemetry);

        let userTokens = parseInt(localStorage.getItem(STORAGE_TOKENS_KEY)) || 0;
        let unlockedThemeIds = JSON.parse(localStorage.getItem(STORAGE_UNLOCKED_KEY)) || ['theme-navy'];

        function updateTokenUI() {
            const badge = document.getElementById('tokenBadgeCount');
            if (badge) badge.innerText = `${userTokens.toLocaleString()} Token${userTokens === 1 ? '' : 's'}`;
        }

        function redeemDeveloperCode() {
            const input = document.getElementById('developerRedeemInput');
            const val = (input.value || '').trim().toLowerCase();
            if (val === 'happybirthdaydaniel') {
                userTokens += 999999;
                localStorage.setItem(STORAGE_TOKENS_KEY, userTokens);
                updateTokenUI();
                showToast('🎉 Code Redeemed! 999,999 Tokens Granted!', 'success');
                input.value = '';
            } else {
                showToast('❌ Invalid Code. Try happybirthdaydaniel', 'error');
            }
        }

        let selectedEditingEvent = null;

        document.addEventListener('DOMContentLoaded', () => {
            updateViewportTelemetry();
            updateTokenUI();

            // Layout Switcher Buttons
            document.querySelectorAll('.layout-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.layout-btn').forEach(b => {
                        b.className = "layout-btn px-3 py-1.5 rounded-md font-medium transition-all text-xs flex items-center gap-1 text-saints-muted hover:text-white";
                    });
                    btn.className = "layout-btn active px-3 py-1.5 rounded-md font-medium transition-all text-xs flex items-center gap-1 bg-saints-red text-white";

                    currentActiveLayout = btn.dataset.layout;
                    renderCurrentLayout();
                });
            });

            // Search and Category filters
            document.getElementById('globalSearchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderCurrentLayout();
            });

            document.querySelectorAll('.cat-filter').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const cat = e.target.dataset.cat;
                    if (e.target.checked) activeCategories.add(cat);
                    else activeCategories.delete(cat);
                    renderCurrentLayout();
                });
            });

            // Drawer Toggle
            const sidebar = document.getElementById('appSidebar');
            const backdrop = document.getElementById('drawerBackdrop');
            const toggleDrawer = () => {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            };

            document.getElementById('sidebarToggleBtn').addEventListener('click', toggleDrawer);
            document.getElementById('closeDrawerBtn').addEventListener('click', toggleDrawer);
            backdrop.addEventListener('click', toggleDrawer);

            // Modals & Submits
            document.querySelectorAll('.closeModalBtn').forEach(b => {
                b.addEventListener('click', () => document.querySelectorAll('.fixed.inset-0').forEach(m => m.classList.add('hidden')));
            });

            document.getElementById('openCreateEventModalBtn').addEventListener('click', () => openEventCreateModal());
            document.getElementById('mobileNavAdd').addEventListener('click', () => openEventCreateModal());
            document.getElementById('tokenVaultBtn').addEventListener('click', () => document.getElementById('vaultModal').classList.remove('hidden'));
            document.getElementById('mobileNavVault').addEventListener('click', () => document.getElementById('vaultModal').classList.remove('hidden'));

            document.getElementById('saveEventSubmitBtn').addEventListener('click', handleSaveEventSubmit);
            document.getElementById('deleteEventBtn').addEventListener('click', handleDeleteEventSubmit);
            document.getElementById('redeemCodeBtn').addEventListener('click', redeemDeveloperCode);

            renderCurrentLayout();
        });

        function openEventCreateModal() {
            selectedEditingEvent = null;
            document.getElementById('eventModalTitle').innerText = "Create Saints Event";
            document.getElementById('inputEventTitle').value = '';
            document.getElementById('inputEventCategory').value = 'academics';
            document.getElementById('inputEventDate').value = '2026-09-15';
            document.getElementById('inputEventDesc').value = '';
            document.getElementById('deleteEventBtn').classList.add('hidden');
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function openEventEditModal(evt) {
            selectedEditingEvent = evt;
            document.getElementById('eventModalTitle').innerText = "Edit Saints Event";
            document.getElementById('inputEventTitle').value = evt.title;
            document.getElementById('inputEventCategory').value = evt.cat;
            document.getElementById('inputEventDate').value = evt.date;
            document.getElementById('inputEventDesc').value = evt.desc || '';
            document.getElementById('deleteEventBtn').classList.remove('hidden');
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function handleSaveEventSubmit() {
            const title = document.getElementById('inputEventTitle').value.trim();
            const cat = document.getElementById('inputEventCategory').value;
            const date = document.getElementById('inputEventDate').value;
            const desc = document.getElementById('inputEventDesc').value;

            if (!title || !date) {
                showToast('Please enter both title and date.', 'error');
                return;
            }

            const events = getStoredEvents();
            if (selectedEditingEvent) {
                const idx = events.findIndex(e => e.id === selectedEditingEvent.id);
                if (idx !== -1) events[idx] = { ...selectedEditingEvent, title, cat, date, desc };
                showToast('Event updated!', 'success');
            } else {
                events.push({ id: Date.now(), title, cat, date, desc });
                showToast('Event created!', 'success');
            }

            saveStoredEvents(events);
            document.getElementById('eventModal').classList.add('hidden');
            renderCurrentLayout();
        }

        function handleDeleteEventSubmit() {
            if (selectedEditingEvent) {
                const events = getStoredEvents().filter(e => e.id !== selectedEditingEvent.id);
                saveStoredEvents(events);
                showToast('Event deleted', 'info');
            }
            document.getElementById('eventModal').classList.add('hidden');
            renderCurrentLayout();
        }
    </script>
</body>
</html>
